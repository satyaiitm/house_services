<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body>

    <div class="container sinreg">

        <h1>Service Remark</h1>
        <h4>Request id : {{request.id}}</h4>

        <!-- <div class="row row-cols-3">
        <div class="col mb-3">Service name</div>
        <div class="col mb-3">Description</div>
        <div class="col mb-3">dd/mm/yyyy</div>
        <div class="col mb-3">Professional ID</div>
        <div class="col mb-3">Professional Name</div>
        <div class="col mb-3">Contact No.</div>
    </div> -->

        <div class="row row-cols-3 text-info bg-dark">
            <div class="col mb-3">{{request.ss.sname}}</div>
            <div class="col mb-3">{{request.ss.description}}</div>
            <div class="col mb-3">{{request.date_of_request}}</div>
            <div class="col mb-3">{{request.pro.id}}</div>
            <div class="col mb-3">{{request.pro.name}}</div>
            <div class="col mb-3">{{request.pro.phone}}</div>
        </div>

        <form action="/remark/{{request.id}}" method="POST" id="feedback_form">

            <h5>How do you rate your overall experience?</h5>

            <div class="mb-3 d-flex flex-row justify-content-center ">
                <span class="form-check "> <input class="form-check mx-3" type="radio" name="rating" id="str1"
                        value="1"><label for="str1"></label>Worst</span>
                <span class="form-check "><input class="form-check mx-3" type="radio" name="rating" id="str2"
                        value="2"><label for="str2"></label>Poor</span>
                <span class="form-check "><input class="form-check mx-3" type="radio" name="rating" id="str3"
                        value="3"><label for="str3"></label>Average</span>
                <span class="form-check "><input class="form-check mx-3" type="radio" name="rating" id="str4"
                        value="4"><label for="str4">Good</label></span>
                <span class="form-check "><input class="form-check mx-3" type="radio" name="rating" id="str5"
                        value="5"><label for="str5">Excellent</label></span>
            </div>


            <div class=" row mb-3">
                <label class=" col form-label" for="feedback_comments">Remark (if any) :</label>
                <textarea class="col form-control" name="remark"></textarea>
            </div>



            <!-- <button type="submit" class="btn btn-success ">Submit</button> -->
            <input type="submit" name="" id="" value="Submit">
            <a class="btn btn-danger " href="/customer/home/{{request.cust.id}}">Close</a>
            <!-- <button type="submit" class="btn btn-danger " >Close</button> -->
        </form>




    </div>
</body>

</html>

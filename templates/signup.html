<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>{{usertype}} signup</title>
</head>

<body>

    <div class="sinreg">
        {% if usertype == "customer" %}
        

        <h1>Customer Signup</h1>
        <form action="/signup/customer" method="POST">
            <label for="">Email ID(Username) :</label>
            <input type="text" name="username" id=""> <br>

            <label for="">Password :</label>
            <input type="password" name="passw" id=""> <br>

            <label for="">Fullname :</label>
            <input type="text" name="name" id=""> <br>

            <label for="">Phone number :</label>
            <input type="text" name="phone" id=""> <br>

            <label for=""> Address :</label>
            <textarea name="address" id=""></textarea> <br>

            <label for="">Pin Code:</label>
            <input type="text" name="pin" id=""> <br>

            <input type="submit" name="" id="" value="Register">
        </form>
        <a href="/">Login here</a>

        {% elif usertype == "professional" %}



        <h1>Service Professional Signup</h1>
        <form action="/signup/professional" method="POST" enctype="multipart/form-data">
            <label for="">Email ID(Username) :</label>
            <input type="text" name="uid" id=""> <br>

            <label for="">Password :</label>
            <input type="text" name="pwd" id=""> <br>

            <label for="">Fullname :</label>
            <input type="text" name="name" id=""> <br>

            <label for="">Phone number :</label>
            <input type="text" name="phone" id=""> <br>

            <label for="">Service Name :</label>
            <!-- <input type="text" name="" id=""> <br> -->
            <select name="service" id="">
                {% for s in serv %}
                <option value="{{s["id"]}}">{{s["sname"]}}</option>
                {% endfor %}
            </select> <br>

            <label for="">Service Description :</label>
            <input type="text" name="pro_descrip" id=""> <br>

            <label for="">Experience (in yrs) :</label>
            <input type="text" name="exp" id=""> <br>

            <label for=""> <span>Attach documents :</span> <br> <span>(single pdf)</span> </label>
            <input type="file" name="document" id=""> <br>

            <label for=""> Address :</label>
            <textarea rows="5" cols="21" name="address" id=""></textarea> <br>


            <label for="">Pin Code:</label>
            <input type="text" name="pin" id=""> <br>

            <input type="submit" name="" id="" value="Register">
        </form>
        <a href="/">Login here</a>
        {% endif %}
    </div>



</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body >

    
    
    <div class="sinreg">
        <h1>A to Z Household Services</h1>
        <h5>Quality services to make your home shine.</h5>
        
        {% with msg = get_flashed_messages() %}
        {% if msg %}
        {% for m in msg %}
        <div class="alert alert-info text-center">
            {{m}}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        


        <div style="text-align: right;">
            <a  href="/signup/professional" >Register as professional</a>
        </div>
        <form action="/" method="POST">
            <label for="">Registered Email ID : </label>
            <input type="text" name="username" required> <br>
            <label for="">Password :</label>
            <input  type="password" name="passw" required> <br>
            <input type="submit"  value="Login">


        </form>
        <a href="/signup/customer">Create Account?</a>
    </div>

    
    






























</body>

</html>
